<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#eee8d9"><meta name="description" content="街角早餐铺：认真听，慢慢做，把每一份早安做得刚刚好。原创早餐经营小游戏测试版。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23c36a4e'/%3E%3Ctext x='20' y='29' text-anchor='middle' font-size='27' fill='%23fff4df'%3E早%3C/text%3E%3C/svg%3E"><title>街角早餐铺 · 每一份早安，都刚刚好</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
<header class="topbar"><a class="brand" href="./" aria-label="街角早餐铺首页"><span class="brand-seal">早</span><span>街角早餐铺<small>STORIES OVER BREAKFAST</small></span></a><div class="header-actions"><span class="beta">试玩版 0.1</span><button class="icon-btn" id="sound-button" aria-label="关闭音效" title="切换音效">♪</button><button class="icon-btn" id="help-button" aria-label="查看玩法">?</button></div></header>
<main id="game">
<section class="street-panel" aria-label="街角与顾客">
<div class="chapter-heading"><span class="eyebrow" id="chapter-label">CHAPTER 01 · 第一缕香气</span><h1>把早安，<br>做得刚刚好。</h1><p>一间小铺，几位街坊，一口热乎的人情味。</p></div>
<div class="street-scene"><img src="assets/street.svg" alt="阳光下的暖色街角早餐铺，门口摆着绿植和早安小黑板"><div class="weather-pill" id="weather">06:30 · 晴 18°</div><div class="scene-detail" id="scene-detail">今日开张 · 请多关照</div><span class="rain" aria-hidden="true"></span></div>
<div class="order-card"><div class="customer-head"><div class="avatar" id="avatar"></div><div><h2 id="customer-name"></h2><span id="customer-role"></span></div><span class="ticket-num" id="ticket-num"></span></div><p class="customer-quote" id="customer-quote"></p><div class="order-divider"><span>这一份，想要</span><strong id="order-recipe"></strong></div><div class="requirements" id="requirements"></div><p class="customer-note" id="customer-note"></p></div>
<div class="street-footer"><span class="flower">✿</span><span id="story-note"></span></div>
</section>
<section class="kitchen-panel" aria-label="早餐制作台">
<div class="day-stats"><button class="chapter-button" id="chapters-button"><span id="stage-badge">第 1 天</span><span>选择关卡 ›</span></button><div><span class="stat-label">今日心意</span><strong id="score">000</strong></div><div><span class="stat-label">连续好评</span><strong id="combo">0<span>份</span></strong></div></div>
<div class="progress-row"><span id="order-progress-label">早餐进度 1 / 3</span><div class="progress-track"><span id="order-progress"></span></div></div>
<div class="section-title"><h2><b>01</b> 点选食材</h2><span>点一下加入，再点可撤回</span></div>
<div class="ingredients" id="ingredients"></div>
<div class="recipe-strip"><span class="recipe-book">配方小抄</span><span id="recipe-summary"></span><button id="recipes-button" aria-label="查看全部配方">全部 ›</button></div>
<div class="section-title cook-title"><h2><b>02</b> 用心煎好</h2><button class="clear-button" id="clear-button">↺ 清空重做</button></div>
<div class="griddle-area"><div class="griddle"><div class="griddle-surface"><div class="food" id="food"></div><div class="steam" aria-hidden="true"><i></i><i></i><i></i></div><span class="pan-status" id="pan-status">料理台等你大展身手</span></div><span class="pan-handle"></span></div><div class="cook-controls"><span class="control-label">火候</span><div class="segmented" role="group" aria-label="选择火候"><button data-texture="soft" aria-pressed="true">普通</button><button data-texture="crisp" aria-pressed="false">焦脆</button></div><button class="cook-button" id="cook-button"><span>开火煎制</span><span class="cook-time">约 2 秒</span></button><div class="cooking-progress"><span id="cook-progress"></span></div></div></div>
<div class="finish-row"><div><h2><b>03</b> 装好出餐</h2><div class="packaging" role="group" aria-label="装盘方式"><button data-packaging="plate" aria-pressed="true">◯ 堂食装盘</button><button data-packaging="bag" aria-pressed="false">♧ 打包带走</button></div></div><button class="serve-button" id="serve-button">递上早餐 <span>↗</span></button></div>
<div class="feedback" id="feedback" role="status" aria-live="polite"></div>
<p class="gentle-note">不赶时间，只记心意。做错了也可以重新来。</p>
</section>
</main>
<footer class="page-footer"><span>小小早餐，大大满足。</span><span id="save-status">进度保存在此浏览器 · 无广告</span></footer>
</div>
<dialog id="modal"><div class="modal-content" id="modal-content"></div></dialog>
<script type="module" src="app.js"></script>
</body></html>
